name: ci

on:
  push:
  pull_request:

jobs:
  launchers:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check POSIX launcher syntax
        if: runner.os != 'Windows'
        run: bash -n run.sh run.command
      - name: Check PowerShell launcher syntax
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path run.ps1), [ref]$null, [ref]$errors)
          if ($errors) { $errors | Format-List; exit 1 }

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest

  optional-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: torch
            extras: torch
            command: pytest tests/test_prediction_real.py
          - name: video
            extras: video
            command: python -c "import cv2, yt_dlp; import segcraft.video"
          - name: app
            extras: app
            command: python -c "from segcraft.webapp import create_app; app = create_app(); print(app.title)"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install ${{ matrix.name }} extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,${{ matrix.extras }}]"
      - name: Smoke ${{ matrix.name }}
        run: ${{ matrix.command }}

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker compose build
      - name: Start and verify
        run: |
          docker compose up --detach
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Stop
        if: always()
        run: docker compose down --volumes
